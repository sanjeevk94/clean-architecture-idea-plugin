name: Publish IDE Plugin

on:
  push:
    tags: [ "v*" ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write signing keys from secrets
        working-directory: clean-architecture-idea-plugin
        env:
          CERT_CHAIN:  ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          echo "$CERT_CHAIN"  | base64 --decode > chain.crt
          echo "$PRIVATE_KEY" | base64 --decode > private.pem

      - name: Verify plugin
        working-directory: clean-architecture-idea-plugin
        run: ./gradlew verifyPlugin

      - name: Build & sign plugin
        working-directory: clean-architecture-idea-plugin
        env:
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew buildPlugin signPlugin

      - name: Publish to JetBrains Marketplace
        working-directory: clean-architecture-idea-plugin
        env:
          PUBLISH_TOKEN:        ${{ secrets.PUBLISH_TOKEN }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      - name: Upload signed plugin zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-architecture-idea-plugin-${{ github.ref_name }}
          path: clean-architecture-idea-plugin/build/distributions/*.zip

<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Dark IDE-style background -->
  <rect width="16" height="16" rx="2.5" fill="#1E1F22"/>

  <!-- Phone body -->
  <rect x="3.5" y="0.8" width="9" height="13.5" rx="1.8" fill="#2D2D30" stroke="#5E7691" stroke-width="0.9"/>

  <!-- Speaker notch -->
  <rect x="5.8" y="2" width="4.4" height="0.8" rx="0.4" fill="#5E7691"/>

  <!-- Domain layer — innermost, narrowest, gold -->
  <rect x="5.2" y="3.6" width="5.6" height="1.8" rx="0.5" fill="#FFC66D"/>

  <!-- Data layer — middle width, blue -->
  <rect x="4.8" y="6.0" width="6.4" height="1.8" rx="0.5" fill="#6897BB"/>

  <!-- App/Presentation layer — widest, green -->
  <rect x="4.2" y="8.4" width="7.6" height="1.8" rx="0.5" fill="#6A9955"/>

  <!-- Home indicator -->
  <rect x="6.5" y="12.0" width="3" height="0.75" rx="0.4" fill="#5E7691"/>
</svg>
